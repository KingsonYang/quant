version: 1
strategy:
  name: shandian_1hao_erci_baoliang_qidong_advanced
  display_name: 闪电一号之二次爆量启动进阶版
  description: 在 D0 爆量阳线、平台不破低点、D1 二次放量启动基础上，强化信号日涨幅和换手活跃度，压制信号日相对近 5 日均量过度爆量的过热样本。
selection:
  type: pattern_sql
  pattern_id: second_volume_launch_v1
  sort_by: composite_score
  sort_order: DESC
  filter_rules:
    - field: change_pct
      operator: gte
      value: 6.0
    - field: turnover_ratio
      operator: gte
      value: 3.5
    - field: volume_ratio_prev_5d_avg
      operator: lte
      value: 2.6
  params:
    lookback_calendar_days: 120
    platform_max_trade_days: 30
    k0_volume_multiple: 2.5
    k1_volume_multiple: 1.2
    d0_change_min_pct: 5.0
    d1_change_min_pct: 5.0
    d1_prev2_max_change_pct: 10.0
backtest_selection:
  holding_period: 1
  selection_top_n: 3
strategy_backtest:
  holding_period: 4
  max_positions: 1
  max_daily_buys: 1
  initial_capital: 100000
  position_size_pct: 100
  take_profit_pct: 20
  stop_loss_pct: -10
  selection_top_n: 2
optimization:
  enabled: true
  search_space:
    backtest_selection.holding_period: [1, 2, 3, 4, 5]
    backtest_selection.selection_top_n: [1, 2, 3, 5]
    strategy_backtest.holding_period: [2, 3, 5]
    strategy_backtest.max_positions: [1, 2, 3]
    strategy_backtest.max_daily_buys: [1, 2]
    strategy_backtest.position_size_pct: [50, 70, 100]
    strategy_backtest.take_profit_pct: [8, 10, 15, 20]
    strategy_backtest.stop_loss_pct: [-10, -7, -5]
    strategy_backtest.selection_top_n: [1, 2, 3, 5]
    selection.sort_by: [symbol, d0_date, composite_score]
    selection.sort_order: [ASC, DESC]
    selection.params.k0_volume_multiple: [2.0, 2.5, 3.0]
    selection.params.k1_volume_multiple: [1.2, 1.5, 1.8]
    selection.params.platform_max_trade_days: [20, 30, 40]
    selection.params.d1_change_min_pct: [5.0, 6.0, 7.0]
    selection.params.d1_prev2_max_change_pct: [8.0, 10.0, 12.0]
