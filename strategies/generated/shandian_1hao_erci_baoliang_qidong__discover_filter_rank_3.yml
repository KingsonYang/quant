version: 1  # 策略配置版本；当前代码只支持 1。
strategy:  # 策略元信息，只影响展示、加载校验和实验命名。
  name: shandian_1hao_erci_baoliang_qidong__discover_filter_rank_3  # 策略唯一名称，必须与文件名一致。
  display_name: 闪电一号之二次爆量启动 Discover Filter 3  # 策略中文展示名，可选。
  description: D0 爆量阳线、平台不破低点、D1 二次放量启动的模式策略。 | generated by quant discover filters  # 策略说明，方便区分策略思路。
selection:  # 选股规则配置；决定每天哪些股票进入候选池。
  type: pattern_sql  # 选股类型：rules=字段规则过滤；pattern_sql=内置形态 SQL。
  pattern_id: second_volume_launch_v1  # 二次爆量启动：D0 爆量阳线，平台整理不破低点，D1 再次放量启动。
  sort_by: symbol  # 选股结果排序字段。 按股票代码排序。
  sort_order: ASC  # 排序方向：ASC 升序，DESC 降序。
  params:  # 模式参数；主要手动调试区域，直接影响形态宽严。
    lookback_calendar_days: 120  # 回看自然日窗口；越大允许匹配更早的启动日，但查询更慢。
    platform_max_trade_days: 30  # 二次爆量策略中，D0 到 D1 之间最多允许的平台整理交易日数。
    k0_volume_multiple: 2.0  # D0 成交量相对前 5 个交易日日均量的最低倍数。
    k1_volume_multiple: 1.5  # D1/信号日成交量相对前一交易日成交量的最低倍数。
    d0_change_min_pct: 5.0  # D0 启动日最低涨幅，单位：%。
    d1_change_min_pct: 5.0  # D1/信号日最低涨幅，单位：%。
    d1_prev2_max_change_pct: 10.0  # D1 前两个交易日累计涨幅上限，防止信号日前已过热。
  filter_rules:  # 模式选股后的二次数值过滤规则。
    - field: volume_ratio_prev_5d_avg  # 二次过滤字段：当日成交量 / 前 5 个交易日日均成交量，衡量相对放量。
      operator: gte  # 大于等于。
      value: 0.607403  # 二次过滤阈值。
    - field: volume_ratio_prev_5d_avg  # 二次过滤字段：当日成交量 / 前 5 个交易日日均成交量，衡量相对放量。
      operator: lte  # 小于等于。
      value: 1.458806  # 二次过滤阈值。
backtest_selection:  # 信号有效性回测默认值；不考虑资金占用，只看选股信号买卖收益。
  holding_period: 1  # 选股后下个交易日开盘买入，并持有的交易日数。
  selection_top_n: 1  # 每天按 selection 排序后只取前 N 只；null/缺省表示全取。
strategy_backtest:  # 组合/资金回测默认值；考虑现金、仓位数量、买入批次和退出规则。
  holding_period: 3  # 最大持有交易日数；达到后按收盘价退出。
  max_positions: 1  # 最多同时持有的股票数量。
  max_daily_buys: 1  # 单个交易日最多新买入的股票数量。
  initial_capital: 100000.0  # 初始资金。
  position_size_pct: 100.0  # 单只股票目标仓位占当前总资产的百分比。
  take_profit_pct: 20.0  # 止盈阈值，收益率达到该百分比时卖出。
  stop_loss_pct: -5.0  # 止损阈值，收益率低于该百分比时卖出；通常为负数。
  selection_top_n: 1  # 每天按 selection 排序后，只允许前 N 只进入买入候选。
optimization:  # 参数优化配置；quant optimize 会读取这里的候选参数。
  enabled: true  # 是否启用该策略的参数搜索配置。
  search_space:  # 搜索空间；key 是参数路径，value 是候选值列表。
    backtest_selection.holding_period: [1, 2, 3]  # 调参候选：信号有效性回测持有交易日数。
    strategy_backtest.holding_period: [2, 3, 5]  # 调参候选：组合回测最大持有交易日数。
    strategy_backtest.max_positions: [1, 2]  # 调参候选：最多同时持仓数量。
    strategy_backtest.max_daily_buys: [1, 2]  # 调参候选：单日最多买入数量。
    strategy_backtest.position_size_pct: [50, 100]  # 调参候选：单票仓位百分比。
    strategy_backtest.take_profit_pct: [10, 20, 30]  # 调参候选：止盈百分比。
    strategy_backtest.stop_loss_pct: [-10, -5]  # 调参候选：止损百分比。
    strategy_backtest.selection_top_n: [1, 3]  # 调参候选：组合回测每日只交易排序前 N 只。
    selection.params.k0_volume_multiple: [1.5, 2.0, 2.5]  # 调参候选：D0 成交量相对前 5 个交易日日均量的最低倍数。
    selection.params.k1_volume_multiple: [1.2, 1.5, 1.8]  # 调参候选：D1/信号日成交量相对前一交易日成交量的最低倍数。
    selection.params.platform_max_trade_days: [20, 30, 40]  # 调参候选：二次爆量策略中，D0 到 D1 之间最多允许的平台整理交易日数。
    selection.params.d0_change_min_pct: [4.0, 5.0, 6.0]  # 调参候选：D0 启动日最低涨幅，单位：%。
    selection.params.d1_change_min_pct: [4.0, 5.0, 6.0]  # 调参候选：D1/信号日最低涨幅，单位：%。
    selection.params.d1_prev2_max_change_pct: [8.0, 10.0, 12.0]  # 调参候选：D1 前两个交易日累计涨幅上限，防止信号日前已过热。
