version: 1  # 策略配置版本；当前代码只支持 1。
strategy:  # 策略元信息，只影响展示、加载校验和实验命名。
  name: amount_ratio_prev_5d_near_2x__selection_backtest__rank_1__discover_filter_rank_1  # 策略唯一名称，必须与文件名一致。
  display_name: amount_ratio_prev_5d_near_2x Top1 Discover Filter 1  # 策略中文展示名，可选。
  description: 成交额接近前 5 个交易日日均成交额 2 倍的示例策略。 | generated by quant optimize | generated by quant discover filters  # 策略说明，方便区分策略思路。
selection:  # 选股规则配置；决定每天哪些股票进入候选池。
  type: rules  # 选股类型：rules=字段规则过滤；pattern_sql=内置形态 SQL。
  logic: AND  # 多条 rules 的组合逻辑；当前代码支持 AND，表示全部条件都满足。
  sort_by: last_5d_avg_volume  # 选股结果排序字段。 按含当日最近 5 日均量排序。
  sort_order: DESC  # 排序方向：ASC 升序，DESC 降序。
  rules:  # 字段过滤规则列表；每个 - 代表一个条件。
    - field: amount_ratio_prev_5d_avg  # 过滤字段：当日成交额 / 前 5 个交易日日均成交额，衡量资金放量。
      operator: gte  # 大于等于。
      value: 1.99  # 过滤阈值；会与 field 计算结果按 operator 比较。
    - field: amount_ratio_prev_5d_avg  # 过滤字段：当日成交额 / 前 5 个交易日日均成交额，衡量资金放量。
      operator: lt  # 小于。
      value: 2.01  # 过滤阈值；会与 field 计算结果按 operator 比较。
    - field: volume_ratio_last_5d_avg  # 过滤字段：当日成交量 / 含当日最近 5 日均量。
      operator: gte  # 大于等于。
      value: 1.695898  # 过滤阈值；会与 field 计算结果按 operator 比较。
    - field: volume_ratio_last_5d_avg  # 过滤字段：当日成交量 / 含当日最近 5 日均量。
      operator: lte  # 小于等于。
      value: 2.253683  # 过滤阈值；会与 field 计算结果按 operator 比较。
backtest_selection:  # 信号有效性回测默认值；不考虑资金占用，只看选股信号买卖收益。
  holding_period: 1  # 选股后下个交易日开盘买入，并持有的交易日数。
  selection_top_n: 5  # 每天按 selection 排序后只取前 N 只；null/缺省表示全取。
strategy_backtest:  # 组合/资金回测默认值；考虑现金、仓位数量、买入批次和退出规则。
  holding_period: 5  # 最大持有交易日数；达到后按收盘价退出。
  max_positions: 2  # 最多同时持有的股票数量。
  max_daily_buys: 2  # 单个交易日最多新买入的股票数量。
  initial_capital: 100000.0  # 初始资金。
  position_size_pct: 100.0  # 单只股票目标仓位占当前总资产的百分比。
  take_profit_pct: 30.0  # 止盈阈值，收益率达到该百分比时卖出。
  stop_loss_pct: -5.0  # 止损阈值，收益率低于该百分比时卖出；通常为负数。
  selection_top_n: 5  # 每天按 selection 排序后，只允许前 N 只进入买入候选。
optimization:  # 参数优化配置；quant optimize 会读取这里的候选参数。
  enabled: true  # 是否启用该策略的参数搜索配置。
  search_space:  # 搜索空间；key 是参数路径，value 是候选值列表。
    backtest_selection.holding_period: [1, 2, 3]  # 调参候选：信号有效性回测持有交易日数。
    backtest_selection.selection_top_n: [1, 3, 5]  # 调参候选：每天只回测排序前 N 只。
    strategy_backtest.holding_period: [2, 3, 5]  # 调参候选：组合回测最大持有交易日数。
    strategy_backtest.max_positions: [1, 2]  # 调参候选：最多同时持仓数量。
    strategy_backtest.max_daily_buys: [1, 2]  # 调参候选：单日最多买入数量。
    strategy_backtest.position_size_pct: [50, 100]  # 调参候选：单票仓位百分比。
    strategy_backtest.take_profit_pct: [10, 20, 30]  # 调参候选：止盈百分比。
    strategy_backtest.stop_loss_pct: [-10, -5]  # 调参候选：止损百分比。
    strategy_backtest.selection_top_n: [1, 3, 5]  # 调参候选：组合回测每日只交易排序前 N 只。
