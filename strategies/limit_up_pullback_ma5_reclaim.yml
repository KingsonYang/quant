version: 1  # 策略配置版本；当前代码只支持 1。
strategy:  # 策略元信息，只影响展示、加载校验和实验命名。
  name: limit_up_pullback_ma5_reclaim  # 策略唯一名称，必须与文件名一致。
  display_name: 涨停启动回踩五日线收复  # 策略中文展示名，可选。
  description: 涨停启动后缩量小阴回调，允许轻微假跌破涨停日低点但收盘不有效破位，信号日收盘重新站上五日线。  # 策略说明，方便区分策略思路。
selection:  # 选股规则配置；决定每天哪些股票进入候选池。
  type: pattern_sql  # 选股类型：rules=字段规则过滤；pattern_sql=内置形态 SQL。
  pattern_id: limit_up_pullback_ma5_reclaim_v1  # 涨停启动回踩五日线收复：T0 涨停/强势启动，回调缩量，信号日重新站上五日线。
  sort_by: composite_score  # 选股结果排序字段。 按模式综合评分排序。
  sort_order: DESC  # 排序方向：ASC 升序，DESC 降序。
  params:  # 模式参数；主要手动调试区域，直接影响形态宽严。
    lookback_calendar_days: 120  # 回看自然日窗口；越大允许匹配更早的启动日，但查询更慢。
    limit_up_min_pct: 9.5  # T0 启动日最低涨幅，通常接近涨停阈值，单位：%。
    limit_up_close_high_min_ratio: 0.995  # T0 收盘价/最高价最低比例；越接近 1 越要求收盘贴近最高价。
    limit_up_volume_multiple: 1.0  # T0 成交量相对前 5 日均量的最低倍数。
    pullback_min_trade_days: 3  # T0 后到信号日前，至少需要的回调交易日数。
    pullback_max_trade_days: 15  # T0 后到信号日前，最多允许的回调交易日数。
    min_pullback_weak_days: 2  # 回调期至少出现的弱势天数；弱势天由阴线或涨幅低于阈值判定。
    weak_day_max_change_pct: 1.5  # 判定弱势天的涨跌幅上限，单位：%。
    support_low_tolerance_pct: 6.0  # 普通回踩分支中，回调最低价最多允许低于 T0 低点的百分比。
    close_support_tolerance_pct: 2.5  # 普通回踩分支中，回调最低收盘价最多允许低于 T0 低点的百分比。
    must_touch_low_zone_pct: 8.0  # 回调最低价必须进入 T0 低点上方该百分比以内，确保真的回踩到位。
    pullback_avg_volume_max_ratio: 1.0  # 回调期平均成交量 / T0 成交量的上限；越低越强调缩量。
    pullback_max_daily_change_pct: 9.0  # 回调期单日最大涨幅上限，防止中途再次大涨。
    pullback_min_daily_change_pct: -6.0  # 回调期单日最小涨跌幅下限，防止单日跌幅过深。
    recent_ma5_touch_tolerance_pct: 1.0  # 信号日前近 3 个交易日触碰五日线的容忍度。
    signal_min_change_pct: 0.2  # 信号日最低涨幅，单位：%。
    signal_reclaim_low_tolerance_pct: 2.0  # 信号日收盘相对 T0 低点的最低容忍度；越小越要求收复有力。
    signal_max_distance_from_t0_low_pct: 12.0  # 信号日收盘价距离 T0 低点的最大允许幅度；防止追得太高。
    signal_volume_ratio_min: 0.25  # 信号日成交量 / 前 5 日均量的下限。
    signal_volume_ratio_max: 2.5  # 信号日成交量 / 前 5 日均量的上限。
    deep_pullback_enabled: true  # 是否启用深回踩分支；true 会允许更深的假跌破/回踩。
    deep_limit_up_volume_multiple: 0.6  # 深回踩分支下 T0 成交量倍数阈值。
    deep_support_low_tolerance_pct: 18.0  # 深回踩分支中，最低价最多允许低于 T0 低点的百分比。
    deep_close_support_tolerance_pct: 15.0  # 深回踩分支中，最低收盘价最多允许低于 T0 低点的百分比。
    deep_pullback_avg_volume_max_ratio: 2.0  # 深回踩分支中，回调期平均成交量 / T0 成交量的上限。
    deep_pullback_max_daily_change_pct: 12.0  # 深回踩分支中，回调期单日最大涨幅上限。
    deep_pullback_min_daily_change_pct: -10.0  # 深回踩分支中，回调期单日最小涨跌幅下限。
    deep_signal_reclaim_low_tolerance_pct: 5.0  # 深回踩分支中，信号日收盘相对 T0 低点的收复容忍度。
    score_weight_pullback_depth: 0.25  # 综合评分权重：回踩深度。
    score_weight_reclaim_strength: 0.3  # 综合评分权重：信号日收复强度。
    score_weight_volume_shrink: 0.2  # 综合评分权重：回调缩量程度。
    score_weight_weak_day_ratio: 0.15  # 综合评分权重：回调弱势天比例。
    score_weight_turnover: 0.1  # 综合评分权重：信号日换手率。
backtest_selection:  # 信号有效性回测默认值；不考虑资金占用，只看选股信号买卖收益。
  holding_period: 5  # 选股后下个交易日开盘买入，并持有的交易日数。
  selection_top_n: 5  # 每天按 selection 排序后只取前 N 只；null/缺省表示全取。
strategy_backtest:  # 组合/资金回测默认值；考虑现金、仓位数量、买入批次和退出规则。
  holding_period: 3  # 最大持有交易日数；达到后按收盘价退出。
  max_positions: 1  # 最多同时持有的股票数量。
  max_daily_buys: 1  # 单个交易日最多新买入的股票数量。
  initial_capital: 100000  # 初始资金。
  position_size_pct: 100  # 单只股票目标仓位占当前总资产的百分比。
  take_profit_pct: 20  # 止盈阈值，收益率达到该百分比时卖出。
  stop_loss_pct: -5  # 止损阈值，收益率低于该百分比时卖出；通常为负数。
  selection_top_n: 1  # 每天按 selection 排序后，只允许前 N 只进入买入候选。
optimization:  # 参数优化配置；quant optimize 会读取这里的候选参数。
  enabled: true  # 是否启用该策略的参数搜索配置。
  search_space:  # 搜索空间；key 是参数路径，value 是候选值列表。
    backtest_selection.holding_period: [1, 2, 3]  # 调参候选：信号有效性回测持有交易日数。
    strategy_backtest.holding_period: [2, 3, 5]  # 调参候选：组合回测最大持有交易日数。
    strategy_backtest.take_profit_pct: [10, 15, 20]  # 调参候选：止盈百分比。
    strategy_backtest.stop_loss_pct: [-8, -5, -3]  # 调参候选：止损百分比。
    selection.params.limit_up_volume_multiple: [1.0, 1.2, 1.5, 2.0]  # 调参候选：T0 成交量相对前 5 日均量的最低倍数。
    selection.params.pullback_max_trade_days: [10, 15, 20]  # 调参候选：T0 后到信号日前，最多允许的回调交易日数。
    selection.params.support_low_tolerance_pct: [3.0, 5.0, 6.0, 8.0]  # 调参候选：普通回踩分支中，回调最低价最多允许低于 T0 低点的百分比。
    selection.params.close_support_tolerance_pct: [1.0, 2.5, 4.0]  # 调参候选：普通回踩分支中，回调最低收盘价最多允许低于 T0 低点的百分比。
    selection.params.must_touch_low_zone_pct: [5.0, 8.0, 10.0]  # 调参候选：回调最低价必须进入 T0 低点上方该百分比以内，确保真的回踩到位。
    selection.params.signal_min_change_pct: [0.3, 0.5, 1.0, 1.5]  # 调参候选：信号日最低涨幅，单位：%。
    selection.params.signal_reclaim_low_tolerance_pct: [0.0, 2.0, 4.0]  # 调参候选：信号日收盘相对 T0 低点的最低容忍度；越小越要求收复有力。
    selection.params.signal_volume_ratio_min: [0.4, 0.5, 0.8]  # 调参候选：信号日成交量 / 前 5 日均量的下限。
    selection.params.signal_volume_ratio_max: [2.0, 2.5, 3.0]  # 调参候选：信号日成交量 / 前 5 日均量的上限。
    selection.params.deep_limit_up_volume_multiple: [0.5, 0.6, 0.8]  # 调参候选：深回踩分支下 T0 成交量倍数阈值。
    selection.params.deep_support_low_tolerance_pct: [12.0, 15.0, 18.0]  # 调参候选：深回踩分支中，最低价最多允许低于 T0 低点的百分比。
    selection.params.deep_close_support_tolerance_pct: [10.0, 12.0, 15.0]  # 调参候选：深回踩分支中，最低收盘价最多允许低于 T0 低点的百分比。
    selection.params.deep_pullback_avg_volume_max_ratio: [1.2, 1.6, 2.0]  # 调参候选：深回踩分支中，回调期平均成交量 / T0 成交量的上限。
    selection.params.deep_pullback_max_daily_change_pct: [10.0, 12.0]  # 调参候选：深回踩分支中，回调期单日最大涨幅上限。
    selection.params.deep_pullback_min_daily_change_pct: [-10.0, -8.0]  # 调参候选：深回踩分支中，回调期单日最小涨跌幅下限。
    selection.params.deep_signal_reclaim_low_tolerance_pct: [3.0, 5.0, 8.0]  # 调参候选：深回踩分支中，信号日收盘相对 T0 低点的收复容忍度。
