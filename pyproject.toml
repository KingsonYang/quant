[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "0.1.0"
description = "A-share daily backtesting utilities."
requires-python = ">=3.12"
dependencies = [
  "duckdb",
  "httpx",
  "pydantic",
  "PyYAML",
  "typer",
]

[project.scripts]
quant = "quant.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
