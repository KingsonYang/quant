<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}QuantWeb Pro - 机构级量化投研工作台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="/backtests" class="topbar-brand">
      <div class="topbar-logo">Q</div>
      <span class="topbar-title">QUANT<span style="color:var(--accent-cyan)">PRO</span></span>
      <span class="topbar-badge">v2.0</span>
    </a>
    <nav class="topbar-nav">
      <a href="/data" class="{% if active == 'data' or active_nav == 'data' %}active{% endif %}">
        <span>🗄️</span> 数据中心
      </a>
      <a href="/select" class="{% if active == 'select' or active_nav == 'select' %}active{% endif %}">
        <span>🎯</span> 策略选股
      </a>
      <a href="/backtests" class="{% if active == 'backtests' or active_nav == 'backtests' %}active{% endif %}">
        <span>📊</span> 策略回测
      </a>
      <a href="/optimize" class="{% if active == 'optimize' or active_nav == 'optimize' %}active{% endif %}">
        <span>⚡</span> 参数寻优
      </a>
      <a href="/validation" class="{% if active == 'validation' or active_nav == 'validation' %}active{% endif %}">
        <span>🛡️</span> 稳健体检
      </a>
      <a href="/paper" class="{% if active == 'paper' or active_nav == 'paper' %}active{% endif %}">
        <span>📋</span> 模拟跟踪
      </a>
    </nav>
    <div class="topbar-actions">
      <div class="status-pill" id="global-status-pill">
        <span class="status-dot" id="system-status-dot"></span>
        <span id="system-status-text" class="tnum">981万+ 行情就绪</span>
      </div>
      <button id="theme-toggle-btn" class="btn-theme-toggle" type="button" title="切换深色/浅色模式">🌓</button>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Professional K-Line Modal / Drawer with Trade Marker Overlay -->
  <div id="kline-backdrop" class="modal-backdrop">
    <div id="kline-drawer" class="kline-drawer">
      <div class="kline-drawer-header">
        <div class="kline-title-group">
          <h2 id="kline-title">股票走势与买卖点穿透</h2>
          <div id="kline-meta" class="kline-meta">加载中...</div>
        </div>
        <button id="kline-close" class="kline-close-btn" type="button" title="关闭窗口">✕</button>
      </div>
      <div class="kline-drawer-body">
        <div id="kline-trade-banner" class="kline-trade-banner" style="display: none;">
          <div class="kline-trade-detail">
            <span>买入: <strong id="kline-buy-info" class="tnum">-</strong></span>
            <span>卖出: <strong id="kline-sell-info" class="tnum">-</strong></span>
            <span>持股: <strong id="kline-hold-days" class="tnum">-</strong> 天</span>
          </div>
          <div id="kline-pnl-badge" class="tag-badge bg-neutral">-</div>
        </div>
        <div id="kline-chart" style="width: 100%; height: 520px;"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
