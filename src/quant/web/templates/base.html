<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}quant 工作台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js';s.onload=function(){window.__ECHARTS_READY__=true};s.onerror=function(){var f=document.createElement('script');f.src='https://cdn.staticfile.org/echarts/5.5.0/echarts.min.js';f.onload=function(){window.__ECHARTS_READY__=true};document.head.appendChild(f)};document.head.appendChild(s)})();</script>
  {% block extra_head %}{% endblock %}
</head>
  <body>
  <header class="topbar">
    <strong>quant 工作台</strong>
    <nav>
      <a href="/data" class="{% if active == 'data' %}active{% endif %}">数据</a>
      <a href="/select" class="{% if active == 'select' %}active{% endif %}">选股</a>
      <a href="/backtests" class="{% if active == 'backtest' %}active{% endif %}">策略回测</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
    <div id="kline-drawer" hidden><button id="kline-close" type="button">关闭</button><h3 id="kline-title"></h3><div id="kline-status"></div><div id="kline-chart" style="height:420px;width:100%"></div></div>
  </main>
  <script src="/static/app.js?v=6"></script>
</body>
</html>
